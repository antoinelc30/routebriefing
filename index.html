<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteBriefing — NOTAM & MTO Aero</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #0f172a;
      --panel-2: #060a12;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --sky: #38bdf8;
      --emerald: #34d399;
      --rose: #f43f5e;
      --rose-bg: rgba(244, 63, 94, 0.14);
      --rose-border: rgba(244, 63, 94, 0.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .wrap { max-width: 1280px; margin: 0 auto; width: 100%; }
    .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .badge-live {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--rose-bg);
      color: #fda4af;
      border: 1px solid var(--rose-border);
    }
    .pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--sky);
    }
    .controls {
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    input[type="text"], select {
      width: 100%;
      background: var(--panel-2);
      color: #fff;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }
    input[type="range"] { width: 100%; accent-color: var(--sky); cursor: pointer; }
    button {
      cursor: pointer;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      padding: 8px 14px;
    }
    .btn-primary { background: var(--sky); color: #06101d; }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-preset {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
      padding: 4px 9px;
      font-size: 11px;
    }
    .btn-preset:hover { background: #334155; }
    .banner {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #bae6fd;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      padding: 18px 16px 32px;
      flex: 1;
    }
    @media (min-width: 980px) {
      .main-grid { grid-template-columns: 5fr 7fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-body { padding: 12px; }
    canvas { width: 100%; height: 220px; background: var(--panel-2); border-radius: 8px; display: block; }
    .mto-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .mto-box:last-child { margin-bottom: 0; }
    .cat-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid;
    }
    .vfr { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.4); }
    .mvfr { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.4); }
    .ifr { background: var(--rose-bg); color: #fda4af; border-color: var(--rose-border); }
    .decoded-block {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      font-size: 12px;
    }
    .decoded-block ul { margin: 4px 0 0; padding-left: 18px; }
    .decoded-block li { margin-bottom: 3px; }
    .raw-line {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: var(--muted);
      word-break: break-word;
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-card.red { border-color: var(--rose-border); background: rgba(244, 63, 94, 0.07); }
    .stat-val { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .notam-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .notam-card.critical {
      border-color: var(--rose-border);
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.12) 0%, rgba(15, 23, 42, 0.96) 100%);
    }
    .notam-card.filtered { opacity: 0.72; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      margin-right: 6px;
      margin-top: 6px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .tab-btn { background: #1e293b; color: var(--muted); border-color: #334155; padding: 6px 10px; font-size: 12px; }
    .tab-btn.active.red { background: var(--rose-bg); color: #fecdd3; border-color: var(--rose-border); }
    .tab-btn.active { background: rgba(56, 189, 248, 0.18); color: #bae6fd; border-color: rgba(56, 189, 248, 0.45); }
  </style>
</head>
<body>
  <header>
    <div class="wrap row-between">
      <div class="brand">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <strong>RouteBriefing</strong>
            <span class="badge-live mono">NOTAM CRITIQUES • MTO DÉCODÉ</span>
          </div>
          <div style="font-size:12px;color:var(--muted);">Triage NOTAM sur route & METAR/TAF décodés avec marge latérale</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="btnMode" type="button" class="btn-preset mono" onclick="toggleMode()">Source : Direct → Netlify → Démo</button>
        <div id="utcClock" class="pill mono">--:-- UTC</div>
      </div>
    </div>
  </header>

  <section class="controls">
    <div class="wrap">
      <div class="grid-form">
        <div>
          <label>Départ (ou LFPN-LFPM)</label>
          <input id="depInput" class="mono" type="text" value="LFPN" onkeydown="if(event.key==='Enter') runBriefing()" />
        </div>
        <div>
          <label>Waypoints</label>
          <input id="wptInput" class="mono" type="text" value="RBT MEL" onkeydown="if(event.key==='Enter') runBriefing()" />
        </div>
        <div>
          <label>Arrivée</label>
          <input id="arrInput" class="mono" type="text" value="LFPM" onkeydown="if(event.key==='Enter') runBriefing()" />
        </div>
        <div>
          <label>Altitude / Niveau</label>
          <select id="flInput" class="mono" onchange="runBriefing()">
            <option value="15" selected>1 500 ft (VFR Bas)</option>
            <option value="25">2 500 ft (VFR)</option>
            <option value="45">4 500 ft (VFR)</option>
            <option value="85">FL085</option>
            <option value="180">FL180</option>
            <option value="280">FL280</option>
            <option value="350">FL350</option>
          </select>
        </div>
        <div>
          <label>Marge : <span id="corridorLabel" class="mono" style="color:var(--sky)">20 NM</span></label>
          <input id="corridorSlider" type="range" min="10" max="100" step="5" value="20"
            oninput="document.getElementById('corridorLabel').textContent = this.value + ' NM'"
            onchange="runBriefing()" />
        </div>
        <div>
          <button type="button" class="btn-primary" style="width:100%" onclick="runBriefing()">Analyser la route</button>
        </div>
      </div>

      <div class="row-between" style="margin-top:10px;font-size:12px;">
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
          <span style="color:var(--muted)">Essais rapides :</span>
          <button type="button" class="btn-preset mono" onclick="preset('LFPN','RBT MEL','LFPM','15',20)">LFPN → LFPM</button>
          <button type="button" class="btn-preset mono" onclick="preset('LFPN','CHW BNE','LFPZ','25',20)">LFPN → LFPZ</button>
          <button type="button" class="btn-preset mono" onclick="preset('LFPG','LATRA MOROK MTL','LFMN','350',40)">LFPG → LFMN</button>
          <button type="button" class="btn-preset mono" onclick="preset('LFPO','DPE SFD','EGLL','280',45)">LFPO → EGLL</button>
        </div>
        <div id="routeInfo" class="mono" style="color:var(--muted)"></div>
      </div>
      <div id="banner" class="banner mono" style="display:none;"></div>
    </div>
  </section>

  <main class="wrap main-grid">
    <div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-head">
          <span>Couloir de route & stations</span>
          <span id="distBadge" class="mono" style="color:var(--muted)">-- NM</span>
        </div>
        <div class="card-body">
          <canvas id="mapCanvas" width="540" height="220"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <span>METAR & TAF décodés</span>
          <span id="mtoCount" class="mono" style="color:var(--muted)">0 stations</span>
        </div>
        <div id="mtoList" class="card-body"></div>
      </div>
    </div>

    <div>
      <div class="stats">
        <div class="stat-card">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;">NOTAM analysés</div>
          <div id="statTotal" class="stat-val mono">0</div>
        </div>
        <div class="stat-card red">
          <div style="font-size:11px;color:#fda4af;text-transform:uppercase;">Critiques (Rouge)</div>
          <div id="statCrit" class="stat-val mono" style="color:#fb7185;">0</div>
        </div>
        <div class="stat-card">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;">Bruit filtré</div>
          <div id="statFilt" class="stat-val mono" style="color:var(--muted);">0</div>
        </div>
      </div>

      <div class="tabs">
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          <button id="tabCrit" type="button" class="tab-btn active red" onclick="setFilter('crit')">Critiques uniquement (Rouge)</button>
          <button id="tabAll" type="button" class="tab-btn" onclick="setFilter('all')">Tous les NOTAM</button>
          <button id="tabFilt" type="button" class="tab-btn" onclick="setFilter('filt')">Masqués (Bruit)</button>
        </div>
        <label style="margin:0;display:flex;align-items:center;gap:6px;text-transform:none;font-size:12px;color:var(--muted);cursor:pointer;">
          <input id="chkRaw" type="checkbox" onchange="renderAll()" />
          <span>Code brut OACI</span>
        </label>
      </div>

      <div id="notamList"></div>
    </div>
  </main>

  <script>
    const AIRPORTS = {
      LFPN: { name: "Toussus-le-Noble", lat: 48.7519, lon: 2.1061, fir: "LFFF" },
      LFPM: { name: "Melun-Villaroche", lat: 48.6047, lon: 2.6711, fir: "LFFF" },
      LFPZ: { name: "Saint-Cyr-l'École", lat: 48.8011, lon: 2.0672, fir: "LFFF" },
      LFPO: { name: "Paris-Orly", lat: 48.7233, lon: 2.3794, fir: "LFFF" },
      LFPG: { name: "Paris-Charles de Gaulle", lat: 49.0097, lon: 2.5479, fir: "LFFF" },
      LFPB: { name: "Paris-Le Bourget", lat: 48.9694, lon: 2.4414, fir: "LFFF" },
      LFPV: { name: "Vélizy-Villacoublay", lat: 48.7742, lon: 2.1917, fir: "LFFF" },
      LFPT: { name: "Pontoise-Cormeilles", lat: 49.0967, lon: 2.0408, fir: "LFFF" },
      LFPL: { name: "Lognes-Émerainville", lat: 48.8311, lon: 2.6225, fir: "LFFF" },
      LFOX: { name: "Étampes-Mondésir", lat: 48.3822, lon: 2.0711, fir: "LFFF" },
      LFOB: { name: "Beauvais-Tillé", lat: 49.4544, lon: 2.1128, fir: "LFFF" },
      LFMN: { name: "Nice-Côte d'Azur", lat: 43.6584, lon: 7.2159, fir: "LFMM" },
      LFLL: { name: "Lyon-Saint Exupéry", lat: 45.7256, lon: 5.0811, fir: "LFMM" },
      EGLL: { name: "London-Heathrow", lat: 51.4700, lon: -0.4543, fir: "EGTT" },
      LSGG: { name: "Genève-Cointrin", lat: 46.2381, lon: 6.1089, fir: "LSAS" }
    };

    const WAYPOINTS = {
      RBT: { lat: 48.6539, lon: 1.9942 },
      MEL: { lat: 48.4556, lon: 2.8133 },
      CHW: { lat: 48.4719, lon: 1.5469 },
      BNE: { lat: 48.9833, lon: 1.9500 },
      LATRA: { lat: 48.4210, lon: 3.0120 },
      MOROK: { lat: 47.4500, lon: 4.1200 },
      MTL: { lat: 44.5500, lon: 4.7300 },
      DPE: { lat: 49.9250, lon: 1.1700 },
      SFD: { lat: 50.7600, lon: 0.1210 }
    };

    const Q_RULES = {
      QMRLC: { cat: "PISTE", label: "Piste fermée", score: 95, crit: true },
      QFAXX: { cat: "AÉRODROME / CTR", label: "Restriction trafic / TWR", score: 86, crit: true },
      QRTCA: { cat: "ESPACE AÉRIEN / ZRT", label: "Zone réglementée active", score: 90, crit: true },
      QWELW: { cat: "ACTIVITÉ VOL", label: "Voltige / parachutage / drone", score: 84, crit: true },
      QICAS: { cat: "APPROCHE / ILS", label: "Aide approche hors service", score: 82, crit: true },
      QNVAS: { cat: "NAVIGATION / ATS", label: "Route ATS / espace supérieur", score: 66, crit: false },
      QOBCE: { cat: "OBSTACLE", label: "Grue / obstacle ponctuel", score: 22, crit: false },
      QMXLC: { cat: "SOL / TAXIWAY", label: "Taxiway fermé", score: 35, crit: false }
    };

    let autoLive = true;
    let activeFilter = "crit";
    let notamResults = [];
    let mtoResults = [];
    let routePts = [];
    let corridorNm = 20;

    setInterval(() => {
      const d = new Date();
      document.getElementById("utcClock").textContent =
        String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " UTC";
    }, 1000);

    function toggleMode() {
      autoLive = !autoLive;
      document.getElementById("btnMode").textContent =
        autoLive ? "Source : Direct → Netlify → Démo" : "Source : Démo locale";
      runBriefing();
    }

    function preset(dep, wpt, arr, fl, corr) {
      document.getElementById("depInput").value = dep;
      document.getElementById("wptInput").value = wpt;
      document.getElementById("arrInput").value = arr;
      document.getElementById("flInput").value = fl;
      document.getElementById("corridorSlider").value = corr;
      document.getElementById("corridorLabel").textContent = corr + " NM";
      runBriefing();
    }

    function setFilter(f) {
      activeFilter = f;
      ["crit", "all", "filt"].forEach(k => {
        const el = document.getElementById("tab" + k[0].toUpperCase() + k.slice(1));
        el.className = "tab-btn" + (k === f ? " active" + (k === "crit" ? " red" : "") : "");
      });
      renderAll();
    }

    function setBanner(msg) {
      const el = document.getElementById("banner");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    function toRad(d) { return d * Math.PI / 180; }
    function distNm(lat1, lon1, lat2, lon2) {
      const R = 3440.065;
      const a = Math.sin(toRad(lat2 - lat1) / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(toRad(lon2 - lon1) / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function distToAxisNm(lat, lon, pts) {
      if (!Array.isArray(pts) || pts.length < 2) return 0;
      let best = Infinity;
      for (let i = 0; i < pts.length - 1; i++) {
        const latAvg = toRad((pts[i].lat + pts[i + 1].lat) / 2);
        const x = (lon - pts[i].lon) * 60 * Math.cos(latAvg);
        const y = (lat - pts[i].lat) * 60;
        const dx = (pts[i + 1].lon - pts[i].lon) * 60 * Math.cos(latAvg);
        const dy = (pts[i + 1].lat - pts[i].lat) * 60;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, (x * dx + y * dy) / len2)) : 0;
        const d = Math.hypot(x - t * dx, y - t * dy);
        if (d < best) best = d;
      }
      return Number.isFinite(best) ? best : 0;
    }

    function decodePhenomena(str) {
      if (!str) return "";
      const list = [];
      if (/\b\+TSRA\b/.test(str)) list.push("Orage fort + pluie forte");
      else if (/\bTSRA\b/.test(str)) list.push("Orage + pluie");
      else if (/\bTS\b/.test(str)) list.push("Orage");
      if (/\b-RA\b/.test(str)) list.push("Pluie faible");
      else if (/\b\+RA\b/.test(str)) list.push("Pluie forte");
      else if (/\bRA\b/.test(str)) list.push("Pluie");
      if (/\b-DZ\b/.test(str)) list.push("Bruine faible");
      else if (/\bDZ\b/.test(str)) list.push("Bruine");
      if (/\bFG\b/.test(str)) list.push("Brouillard");
      if (/\bBR\b/.test(str)) list.push("Brume");
      if (/\bHZ\b/.test(str)) list.push("Brume sèche");
      return list.join(", ");
    }

    function decodeMetar(raw) {
      if (!raw) return ["Aucune observation disponible"];
      try {
        const out = [];
        const w = raw.match(/\b(VRB|\d{3})(\d{2,3})(?:G(\d{2,3}))?KT\b/);
        if (w) {
          out.push(`Vent : ${w[1] === "VRB" ? "Variable" : w[1] + "°"} pour ${parseInt(w[2], 10)} kt${w[3] ? " (rafales " + parseInt(w[3], 10) + " kt)" : ""}`);
        }
        if (/\bCAVOK\b/.test(raw)) {
          out.push("Visibilité ≥ 10 km, pas de nuages < 5 000 ft ni CB");
        } else {
          const v = raw.match(/\s(\d{4})\s/);
          if (v) {
            const m = parseInt(v[1], 10);
            out.push(`Visibilité : ${m >= 9999 ? "10 km ou plus" : (m / 1000).toFixed(1).replace(".0", "") + " km"}`);
          }
        }
        const ph = decodePhenomena(raw);
        if (ph) out.push(`Phénomènes : ${ph}`);

        const clouds = [...raw.matchAll(/\b(FEW|SCT|BKN|OVC|VV)(\d{3})(CB|TCU)?\b/g)];
        if (clouds.length) {
          const mapC = { FEW: "Quelques", SCT: "Épars", BKN: "Fragmenté", OVC: "Couvert", VV: "Visibilité verticale" };
          out.push("Nuages : " + clouds.map(c => `${mapC[c[1]] || c[1]} ${parseInt(c[2], 10) * 100} ft${c[3] ? " [" + c[3] + "]" : ""}`).join(" • "));
        }
        const td = raw.match(/\s(M?\d{2})\/(M?\d{2})\b/);
        if (td) {
          const t = parseInt(td[1].replace("M", "-"), 10);
          const d = parseInt(td[2].replace("M", "-"), 10);
          out.push(`Température / Rosée : ${t}°C / ${d}°C`);
        }
        const q = raw.match(/\bQ(\d{4})\b/);
        if (q) out.push(`QNH : ${parseInt(q[1], 10)} hPa`);
        return out.length ? out : [raw];
      } catch (_) {
        return [raw];
      }
    }

    function decodeTaf(raw) {
      if (!raw) return null;
      try {
        const lines = [];
        const val = raw.match(/\b(\d{2})(\d{2})\/(\d{2})(\d{2})\b/);
        if (val) lines.push(`Validité : du ${val[1]} à ${val[2]}h UTC au ${val[3]} à ${val[4]}h UTC`);
        const base = decodeMetar(raw);
        if (base.length) lines.push("Base : " + base.join(" | "));
        const evs = [...raw.matchAll(/\b(BECMG|TEMPO|PROB\d{2})\s+([^\n]+?)(?=\s+(?:BECMG|TEMPO|PROB\d{2}|FM\d{6})|$)/g)];
        evs.forEach(e => {
          const body = e[2].trim();
          const slot = body.match(/^(\d{4}\/\d{4})\s*(.*)/);
          const desc = decodeMetar("METAR XXXX 000000Z " + (slot ? slot[2] : body)).join(" • ");
          const ph = decodePhenomena(body);
          lines.push(`${e[1]}${slot ? " [" + slot[1] + "]" : ""} : ${desc}${ph ? " (" + ph + ")" : ""}`);
        });
        return lines;
      } catch (_) {
        return [raw];
      }
    }

    function getCat(raw) {
      if (!raw) return { code: "VFR", cls: "vfr" };
      const visM = raw.match(/\s(\d{4})\s/);
      const vis = raw.includes("CAVOK") ? 9999 : (visM ? parseInt(visM[1], 10) : 9999);
      const cigM = [...raw.matchAll(/(?:BKN|OVC|VV)(\d{3})/g)];
      const cig = cigM.length ? Math.min(...cigM.map(x => parseInt(x[1], 10) * 100)) : 9999;
      if (cig < 500 || vis < 1600) return { code: "LIFR", cls: "ifr" };
      if (cig < 1000 || vis < 5000) return { code: "IFR", cls: "ifr" };
      if (cig <= 3000 || vis <= 8000) return { code: "MVFR", cls: "mvfr" };
      return { code: "VFR", cls: "vfr" };
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 2500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchWeatherWithFallback(ids) {
      try {
        const [mDirect, tDirect] = await Promise.allSettled([
          fetchJsonWithTimeout(`https://aviationweather.gov/api/data/metar?ids=${ids}&format=json`),
          fetchJsonWithTimeout(`https://aviationweather.gov/api/data/taf?ids=${ids}&format=json`)
        ]);
        const mVal = mDirect.status === "fulfilled" && Array.isArray(mDirect.value) ? mDirect.value : [];
        const tVal = tDirect.status === "fulfilled" && Array.isArray(tDirect.value) ? tDirect.value : [];
        if (mVal.length > 0 || tVal.length > 0) {
          return { metars: mVal, tafs: tVal, source: "direct" };
        }
      } catch (_) {}

      try {
        const [mFn, tFn] = await Promise.allSettled([
          fetchJsonWithTimeout(`/.netlify/functions/weather?type=metar&ids=${ids}`),
          fetchJsonWithTimeout(`/.netlify/functions/weather?type=taf&ids=${ids}`)
        ]);
        const mVal = mFn.status === "fulfilled" && Array.isArray(mFn.value) ? mFn.value : [];
        const tVal = tFn.status === "fulfilled" && Array.isArray(tFn.value) ? tFn.value : [];
        if (mVal.length > 0 || tVal.length > 0) {
          return { metars: mVal, tafs: tVal, source: "netlify" };
        }
      } catch (_) {}

      return { metars: [], tafs: [], source: "fallback" };
    }

    async function loadMto(pts, corr, depCode, arrCode) {
      const cand = Object.entries(AIRPORTS)
        .map(([icao, a]) => ({ icao, ...a, dAxis: distToAxisNm(a.lat, a.lon, pts) }))
        .filter(s => s.dAxis <= corr || s.icao === depCode || s.icao === arrCode || s.icao === "LFPO")
        .sort((a, b) => a.dAxis - b.dAxis)
        .slice(0, 6);

      const liveMetar = {};
      const liveTaf = {};
      let sourceUsed = "fallback";

      if (autoLive) {
        const ids = cand.map(s => s.icao).join(",");
        const res = await fetchWeatherWithFallback(ids);
        sourceUsed = res.source;
        res.metars.forEach(x => { if (x && x.icaoId && x.rawOb) liveMetar[x.icaoId] = x.rawOb; });
        res.tafs.forEach(x => { if (x && x.icaoId && x.rawTAF) liveTaf[x.icaoId] = x.rawTAF; });
      }

      if (sourceUsed === "direct") {
        setBanner("MTO en direct depuis AviationWeather.gov, décodée en clair.");
      } else if (sourceUsed === "netlify") {
        setBanner("Repli automatique sur /.netlify/functions/weather, décodée en clair.");
      } else {
        setBanner("Données météo de référence affichées (mode démo ou flux live injoignable).");
      }

      const refTaf = liveTaf[arrCode] || liveTaf[depCode] || liveTaf.LFPO || sampleMto("LFPO").taf;
      const refTafSrc = liveTaf[arrCode] ? arrCode : (liveTaf[depCode] ? depCode : "LFPO");

      return cand.map(s => {
        const metar = liveMetar[s.icao] || sampleMto(s.icao).metar;
        const taf = liveTaf[s.icao] || (s.icao === depCode || s.icao === arrCode ? refTaf : null);
        const note = !liveTaf[s.icao] && taf ? `TAF station de référence (${refTafSrc})` : null;
        return {
          ...s,
          metar,
          taf,
          note,
          cat: getCat(metar),
          metarDec: decodeMetar(metar),
          tafDec: decodeTaf(taf)
        };
      });
    }

      return raw.map(n => {

        const term = n.a === dep || n.a === arr;
        let sc = rule.score + (term ? 12 : 0) - (inCorr ? 0 : 45) - (altOk ? 0 : 35);
        if (n.q === "QOBCE" || n.q === "QMXLC") sc = Math.min(sc, 45);

        ];

    }
